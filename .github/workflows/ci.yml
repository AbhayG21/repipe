name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Exercise the whole supported range: 3.11 is the floor (tomllib), 3.13 the
    # newest. Linux across all three; one macOS entry since that's the platform
    # the release artifact is built on.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile all sources
        run: python3 -m py_compile src/repipe/*.py src/repipe/providers/*.py src/__main__.py

      - name: Unit tests (stdlib unittest, no deps, no secrets)
        run: python3 -m unittest discover -s tests -t . -v

  shellcheck:
    # install.sh is curl-piped into bash by users, so lint it (and build.sh)
    # before it ships. shellcheck is preinstalled on ubuntu runners.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: shellcheck install.sh build.sh

  build-determinism:
    # The committed `repipe` zipapp must match a fresh reproducible build of src/,
    # so a stale artifact can never ship. build.sh pins mtimes + TZ for byte-stable
    # output; guard both that it reproduces and that the committed copy is current.
    # Runs on macOS — the artifact is built + committed on macOS (the supported
    # platform), and zipapp bytes can differ across OSes, so comparing on the same
    # platform is what keeps this a signal instead of a cross-platform false red.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build is reproducible (two builds are byte-identical)
        run: |
          bash build.sh >/dev/null
          cp repipe /tmp/repipe.first
          bash build.sh >/dev/null
          cmp /tmp/repipe.first repipe

      - name: Committed artifact matches src/
        run: git diff --exit-code -- repipe
