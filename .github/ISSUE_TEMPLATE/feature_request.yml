name: ✨ Feature request
description: Suggest a new capability or an improvement to repipe.
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Keep in mind repipe's constraints: **zero runtime
        dependencies** (Python 3 stdlib only) and a **provider-agnostic core**.
        Proposals that fit those tend to land faster.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the pain point or workflow gap. Focus on the "why" before the "what".
      placeholder: |
        When my pipeline fails with X, I currently have to ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like repipe to do? A CLI sketch helps.
      placeholder: |
        Add a `repipe ...` command / flag that ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of repipe does this touch?
      options:
        - New CI provider adapter
        - Existing adapter (Bitbucket Cloud / GitHub Actions)
        - Auto-retry / transient-error detection
        - Notifications (ntfy / desktop)
        - CLI ergonomics (run / init / rerun / list / status / logs / suggestions)
        - Config / auth
        - Docs / website
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, or how you work around this today.
    validations:
      required: false

  - type: checkboxes
    id: constraints
    attributes:
      label: Fit with repipe's constraints
      options:
        - label: This can be done with the Python 3 stdlib only (no new runtime dependencies).
          required: false
        - label: I searched existing issues and this isn't already requested.
          required: true
