# Dependabot config. repipe has zero runtime dependencies (Python stdlib only),
# so the only thing to keep current is the GitHub Actions used in workflows.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # One PR per week for all action bumps instead of one per action.
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
