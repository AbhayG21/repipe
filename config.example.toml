# repipe configuration — copy to ~/.config/repipe/config.toml and edit.
#
# NON-SECRET values only. Never put access tokens or API tokens in here.
# Tokens go in the REPIPE_TOKEN env var (or ~/.config/repipe/credentials, chmod 600).
#
# Everything here is optional — repipe works with no config at all, it just
# asks more questions. Config lets you answer the repeatable ones once.

# ---------------------------------------------------------------------------
# Global — applies to every repo / pipeline
# ---------------------------------------------------------------------------

# Used to auto-fill any variable whose schema sets `autofill = "git_email"`.
# Prefilled from `git config user.email` on first run, then remembered here.
user_email = "you@example.com"

# How --retry-on patterns are matched: "substring" (default) or "regex".
match = "substring"

# Default retry cap for non-prod pipelines.
max_retries = 2

# Desktop notification when a watched run finishes (and on each auto-retry).
# Default: on in an interactive terminal, auto-suppressed in CI / piped runs.
# Sound plays only on the final result; retries are silent banners.
# notify = true

# Also ping (silently) as each individual step/job completes mid-run. Off by
# default — it adds one API call per poll. Same as passing --notify-steps.
# notify_steps = false

# Which run OUTCOMES notify you (all channels — desktop + every push provider).
# Omit this key for the default (all events). List a subset to mute the rest,
# e.g. only get pinged on failures/timeouts. Valid: success, failed, timeout,
# halted (paused at a manual gate), retry.
# notify_events = ["failed", "timeout"]

# Push the finish notification to your PHONE via ntfy (ntfy.sh or self-hosted).
# Unlike the desktop notification above, this fires even with NO terminal — the
# point is to run repipe on an always-on box, close your laptop, and still get
# pinged. Unset => no push. Tapping the phone banner opens the run.
#
# SECURITY: on the public ntfy.sh server, anyone who knows the topic can read
# your notifications. Use a long, RANDOM topic (treat it like a password), not
# "repipe-deploys". Reserved / self-hosted topics that need auth: put the token
# in the credentials file as REPIPE_NOTIFY_TOKEN — NEVER here.
# notify_url = "https://ntfy.sh/repipe-7f3a9c2e-b41d-4e6a-9c1f-secret"

# Or push to Google Chat — personal push via a private "space of one" incoming
# webhook (create a space, invite nobody, Apps & integrations → Manage webhooks).
# Configure any combination and ALL fire. The webhook URL IS the credential (its
# key+token query params) — keep it private. Unset => that provider is off.
# notify_gchat_url = "https://chat.googleapis.com/v1/spaces/AAAA/messages?key=...&token=..."

# Or Slack — an incoming-webhook URL. For personal push, point it at a private
# channel with only you in it. Webhook URL is the credential; keep it private.
# notify_slack_url = "https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXX"

# Watch loop tuning (read by the interactive flow and `rerun`; `run` takes these
# as --poll-interval / --timeout flags instead). Seconds.
# poll_interval = 20
# timeout = 3600

# DEFAULT retry patterns — YOU choose these. repipe applies NONE by default; it
# only re-triggers a failed run whose log matches a pattern you list here (or pass
# with --retry-on). No pattern configured => no retries. A repo can OVERRIDE this
# whole set with its own `retry_on` (see the per-repo section below); an explicit
# --retry-on beats both. Run `repipe suggestions` for a starter list to copy.
retry_on = ["Could not resolve host", "OutOfMemoryError", "toomanyrequests"]

# PROD auto-retry. Prod runs normally refuse to auto-retry unless you pass
# --force, since there's no shipped "safe" pattern set to fall back on. Set this
# to true to record standing consent so `repipe run` doesn't need the flag every
# time (the interactive flow still asks, but defaults to yes).
# Precedence: --force > per-repo `prod_retry` > this global > off.
# prod_retry = false

# ---------------------------------------------------------------------------
# Per-repo — keyed by "<workspace>/<repo>" (Bitbucket) or "<owner>/<repo>" (GitHub)
# `provider` is auto-detected from the git remote on `repipe init`:
#   bitbucket.org → "bitbucket"   ·   github.com → "github"
# ---------------------------------------------------------------------------

[repos."your-workspace/your-repo"]
provider           = "bitbucket"
qa_branch_prefix   = "qa-release"  # used to pick the newest QA release branch
prod_branch_prefix = "prod-release"
# Optional: this repo's OWN retry patterns. When present they fully REPLACE the
# default retry_on above for this repo (not merged). Omit to use the default.
# retry_on = ["flaky integration suite", "error pulling image"]
# Optional: override the global `prod_retry` for this repo. Omit to inherit it;
# an explicit false opts this repo out even when the global is true.
# prod_retry = true

# A GitHub Actions repo looks the same — repipe reads workflow_dispatch inputs
# from .github/workflows/*.yml, so `enum`/`default` often come for free.
# [repos."your-org/your-repo"]
# provider = "github"

# ---------------------------------------------------------------------------
# Per-variable input schema — design your own pipeline inputs here.
# One [repos."ws/repo".variables.<NAME>] table per pipeline variable you want
# to constrain. All fields optional; `repipe init` scaffolds a stub per
# discovered variable (seeding `enum` from any yml-declared allowed-values).
# ---------------------------------------------------------------------------

# enum      — allowed values (interactive shows a picker; validated on trigger)
# default   — value used when you don't pass --var / press enter
# required  — must be provided (defaults true for a declared var with no default)
# pattern   — value must match this regex (e.g. an email or version format)
# autofill  — "git_email": fill from user_email / git, and don't prompt
# remember  — persist entered values and show recent ones as suggestions
# no_spaces_unless — spaces allowed only when the named sibling var is truthy
# hint      — a one-line help string shown before the prompt

[repos."your-workspace/your-repo".variables.Environment]
enum     = ["staging", "canary", "production"]
default  = "staging"
required = true

[repos."your-workspace/your-repo".variables.Owner]
pattern  = ".+@.+"
autofill = "git_email"

[repos."your-workspace/your-repo".variables.Services]
required         = true
remember         = true
no_spaces_unless = "MultiService"
hint             = "space-separate multiple only when MultiService=true"

# repipe also persists per-repo state under this repo section as you use it:
#   [repos."ws/repo".remembered]  — values for `remember = true` variables
#   [repos."ws/repo".last_run]    — so `repipe rerun` can repeat your last run
#   [repos."ws/repo".recent.<env>] — the last few branches/pipelines you actually
#                                   ran for that env, so the interactive pickers
#                                   list them first and mark them `suggested`
